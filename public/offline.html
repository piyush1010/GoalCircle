<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101B2D">
<title>No connection · GoalYaar</title>
<style>
  :root { --bg: #F8FAFC; --card: #FFFFFF; --ink: #0F172A; --quiet: #64748B; --line: #E2E8F0; --btn: #0F172A; --btn-ink: #FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0B1220; --card: #111A2B; --ink: #F1F5F9; --quiet: #94A3B8; --line: #1E293B; --btn: #F8FAFC; --btn-ink: #0F172A; } }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 360px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { margin-top: 20px; font-size: 22px; font-weight: 700; }
  p { margin-top: 8px; font-size: 15px; line-height: 1.5; color: var(--quiet); }
  button { margin-top: 24px; width: 100%; height: 48px; border: 0; border-radius: 16px; background: var(--btn); color: var(--btn-ink);
           font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/goalyaar-icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>GoalYaar needs an internet connection to open this page. Check your mobile data or Wi-Fi, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener('online', function () { location.reload() })</script>
</body>
</html>
